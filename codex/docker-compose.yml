services:
  db:
    image: ankane/pgvector:latest
    container_name: brandwise-db
    environment:
      POSTGRES_USER: brandwise
      POSTGRES_PASSWORD: brandwise_password
      POSTGRES_DB: brandwise
    ports:
      - "5432:5432"
    volumes:
      - brandwise-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandwise -d brandwise"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brandwise-redis
    command: redis-server --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - brandwise-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: brandwise-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - brandwise-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: brandwise-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set brandwise http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb brandwise/brandwise-assets;
      /usr/bin/mc anonymous set public brandwise/brandwise-assets;
      exit 0;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brandwise-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://brandwise:brandwise_password@db:5432/brandwise
      - SYNC_DATABASE_URL=postgresql+psycopg2://brandwise:brandwise_password@db:5432/brandwise
      - REDIS_URL=redis://:redis_password@redis:6379/0
      - CELERY_BROKER_URL=redis://:redis_password@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:redis_password@redis:6379/1
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_BUCKET=brandwise-assets
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://minio:9000
      - SECRET_KEY=change-this-secret-key-to-a-random-32-char-string
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - APP_ENV=development
      - DEBUG=true
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - TESSERACT_CMD=/usr/bin/tesseract
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brandwise-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://brandwise:brandwise_password@db:5432/brandwise
      - SYNC_DATABASE_URL=postgresql+psycopg2://brandwise:brandwise_password@db:5432/brandwise
      - REDIS_URL=redis://:redis_password@redis:6379/0
      - CELERY_BROKER_URL=redis://:redis_password@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:redis_password@redis:6379/1
      - SECRET_KEY=change-this-secret-key-to-a-random-32-char-string
      - ALGORITHM=HS256
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.services.celery_app worker --loglevel=info

volumes:
  brandwise-db-data:
  brandwise-redis-data:
  brandwise-minio-data:
