[project]
name = "brandwise"
version = "0.1.0"
description = "Brandwise — AI Brand-Governance Platform"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.24.0",
    "pytest-cov==4.1.0",
    "ruff==0.6.6",
    "mypy==1.11.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "normal"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit",
    "integration",
    "api",
]
