<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brandwise • AI Brand Governance Platform</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM (v18.3.1) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone to compile JSX in browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>

  <!-- jsPDF for High-Fidelity Audit Certificates -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- QRCode.js for verifiable certificate QR embedding -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Google Fonts: Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            tech: ['"Space Grotesk"', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(10, 15, 20, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.8); }

    .glass-obsidian {
      background: rgba(13, 20, 18, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(16, 185, 129, 0.15);
      box-shadow: 0 0 25px -5px rgba(0, 0, 0, 0.5);
    }
    .glass-emerald {
      background: rgba(6, 26, 20, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(52, 211, 153, 0.28);
      box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.2);
    }
    .glass-studio {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 4px 20px -2px rgba(16, 185, 129, 0.06);
    }
  </style>
</head>
<body class="transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_FINDINGS = [
      {
        id: 'f-1',
        category: 'claim',
        severity: 'high',
        highlightedText: "India's #1 skincare brand",
        explanation: "Fact register does not substantiate '#1'. Nearest registered claim is 'top 5 in category, 2025 survey' (owner: Market Research, expires Dec 2026).",
        sourceRef: "Fact Register #FR-402 (Market Position)",
        confidence: 0.94,
        suggestedFix: "One of India's top 5 skincare brands (2025 survey)",
        status: 'open',
      },
      {
        id: 'f-2',
        category: 'claim',
        severity: 'high',
        highlightedText: "Cures acne in 7 days",
        explanation: "Guidelines strictly prohibit curative or guaranteed time-bound medical outcomes without sign-off from Legal and Regulatory Affairs.",
        sourceRef: "Guideline Clause §4.2 (Health & Regulated Claims)",
        confidence: 0.99,
        suggestedFix: "Helps reduce the look of acne",
        status: 'open',
      },
      {
        id: 'f-3',
        category: 'disclaimer',
        severity: 'high',
        highlightedText: "Use code GLOW20 for discount!",
        explanation: "Promotional commercial collaboration post lacks the mandatory prominent disclosure tag (#ad) as mandated by ASCI Influencer Code 2025.",
        sourceRef: "ASCI Influencer Code 2025 §1.1",
        confidence: 0.91,
        suggestedFix: "Add #ad at the beginning of the caption",
        status: 'open',
      },
      {
        id: 'f-4',
        category: 'tone',
        severity: 'medium',
        highlightedText: "Hey guys!! Grab this crazy deal",
        explanation: "Informal slang greeting conflicts with approved Brand Voice standard (warm, professional, accessible).",
        sourceRef: "Guideline Clause §2.1 (Tone & Language)",
        confidence: 0.88,
        suggestedFix: "Hello! Here is an offer we think you will like.",
        status: 'open',
      },
    ];

    /* ============================================================
       LOGIN VIEW COMPONENT
       ============================================================ */
    function LoginView({ theme, setTheme, onLoginSuccess }) {
      const [authMode, setAuthMode] = useState('password'); // 'password' | 'otp'
      const [selectedRole, setSelectedRole] = useState('admin'); // 'admin' | 'chief'
      const [password, setPassword] = useState('admin@123');
      const [email, setEmail] = useState('admin@dermacare.com');
      const [otp, setOtp] = useState(['', '', '', '', '', '']);
      const [step, setStep] = useState('form'); // 'form' | 'otp'
      const [isLoading, setIsLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);
      const [activeNotice, setActiveNotice] = useState(null);
      const [countdown, setCountdown] = useState(60);
      const otpInputs = useRef([]);

      const isDark = theme !== 'studio';

      const bgStyle =
        theme === 'obsidian'
          ? 'bg-[#090F0D] text-emerald-50'
          : theme === 'mint'
          ? 'bg-[#04140F] text-emerald-100'
          : 'bg-[#F9FAF9] text-slate-900';

      const cardStyle =
        theme === 'obsidian'
          ? 'glass-obsidian'
          : theme === 'mint'
          ? 'glass-emerald'
          : 'glass-studio';

      const headerBorder =
        theme === 'obsidian'
          ? 'border-emerald-500/15'
          : theme === 'mint'
          ? 'border-emerald-500/30'
          : 'border-slate-200';

      const accentBtn =
        theme === 'obsidian'
          ? 'bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-bold shadow-lg shadow-emerald-500/25'
          : theme === 'mint'
          ? 'bg-gradient-to-r from-teal-400 to-emerald-500 hover:from-teal-300 hover:to-emerald-400 text-slate-950 font-bold shadow-lg shadow-emerald-400/30'
          : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm font-semibold';

      useEffect(() => {
        let timer;
        if (step === 'otp' && countdown > 0) {
          timer = setInterval(() => setCountdown((c) => c - 1), 1000);
        }
        return () => clearInterval(timer);
      }, [step, countdown]);

      const handlePasswordLogin = async (e) => {
        if (e) e.preventDefault();
        setErrorMsg(null);
        setIsLoading(true);

        const targetEmail = selectedRole === 'admin' ? 'admin@dermacare.com' : 'chief@dermacare.com';
        const targetPassword = password.trim();

        setTimeout(() => {
          const validPass = selectedRole === 'admin' ? 'admin@123' : 'chief@123';
          if (targetPassword === validPass) {
            const fallbackUser = selectedRole === 'admin' ? {
              name: "System Administrator",
              email: "admin@dermacare.com",
              role: "Administrator",
              tenant: "DermaCare Global Healthcare",
              initials: "AD"
            } : {
              name: "Dr. Aris Thorne",
              email: "chief@dermacare.com",
              role: "Chief Governance Officer",
              tenant: "DermaCare Global Healthcare",
              initials: "CG"
            };
            setIsLoading(false);
            onLoginSuccess(fallbackUser);
          } else {
            setIsLoading(false);
            setErrorMsg('Invalid password. Please check your credentials.');
          }
        }, 350);
      };

      const handleSendOtp = () => {
        const targetEmail = selectedRole === 'admin' ? 'admin@dermacare.com' : 'chief@dermacare.com';
        setErrorMsg(null);
        setIsLoading(true);

        setTimeout(() => {
          setEmail(targetEmail);
          setStep('otp');
          setCountdown(60);
          setOtp(['', '', '', '', '', '']);
          setActiveNotice({
            email: targetEmail,
            otp: "884192",
            time: 'Just now'
          });
          setIsLoading(false);
        }, 400);
      };

      const handleOtpChange = (index, value) => {
        if (!/^\d*$/.test(value)) return;
        const newOtp = [...otp];
        newOtp[index] = value.slice(-1);
        setOtp(newOtp);

        if (value && index < 5 && otpInputs.current[index + 1]) {
          otpInputs.current[index + 1].focus();
        }
      };

      const handleKeyDown = (index, e) => {
        if (e.key === 'Backspace' && !otp[index] && index > 0 && otpInputs.current[index - 1]) {
          otpInputs.current[index - 1].focus();
        }
      };

      const handlePaste = (e) => {
        e.preventDefault();
        const pasted = e.clipboardData.getData('text').trim();
        if (/^\d{6}$/.test(pasted)) {
          const digits = pasted.split('');
          setOtp(digits);
          if (otpInputs.current[5]) otpInputs.current[5].focus();
        }
      };

      const handleAutoFill = () => {
        const digits = "884192".split('');
        setOtp(digits);
        if (otpInputs.current[5]) otpInputs.current[5].focus();
      };

      const handleVerifyOtp = () => {
        const fullOtp = otp.join('');
        if (fullOtp.length < 6) {
          setErrorMsg('Please enter the full 6-digit verification code.');
          return;
        }

        setErrorMsg(null);
        setIsLoading(true);

        setTimeout(() => {
          setIsLoading(false);
          const fallbackUser = selectedRole === 'admin' ? {
            name: "System Administrator",
            email: "admin@dermacare.com",
            role: "Administrator",
            tenant: "DermaCare Global Healthcare",
            initials: "AD"
          } : {
            name: "Dr. Aris Thorne",
            email: "chief@dermacare.com",
            role: "Chief Governance Officer",
            tenant: "DermaCare Global Healthcare",
            initials: "CG"
          };
          onLoginSuccess(fallbackUser);
        }, 400);
      };

      return (
        <div className={`min-h-screen flex flex-col justify-between font-sans transition-colors duration-300 ${bgStyle}`}>
          {/* Header */}
          <header className={`border-b px-6 py-3.5 flex items-center justify-between ${headerBorder} ${isDark ? 'bg-[#090F0D]/80 backdrop-blur-md' : 'bg-white'}`}>
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-lg shadow-inner">
                BW
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <h1 className="text-base font-bold tracking-tight">Brandwise</h1>
                  <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full font-semibold border ${
                    isDark ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' : 'bg-emerald-100 text-emerald-800 border-emerald-200'
                  }`}>
                    Supabase Secured RLS
                  </span>
                </div>
                <p className={`text-xs ${isDark ? 'text-emerald-400/70' : 'text-slate-500'}`}>
                  Authorized Governance Portal (Admin & Chief Officer Only)
                </p>
              </div>
            </div>

            {/* Theme switcher */}
            <div className={`flex items-center p-1 rounded-xl border text-xs ${headerBorder} ${isDark ? 'bg-black/40' : 'bg-slate-100'}`}>
              <button
                onClick={() => setTheme('obsidian')}
                className={`px-2.5 py-1 rounded-lg transition flex items-center space-x-1.5 cursor-pointer ${
                  theme === 'obsidian' ? 'bg-emerald-500/20 text-emerald-300 font-semibold' : isDark ? 'text-emerald-400 hover:text-white' : 'text-slate-600'
                }`}
              >
                <span>🌌</span>
                <span className="hidden sm:inline">Obsidian</span>
              </button>
              <button
                onClick={() => setTheme('mint')}
                className={`px-2.5 py-1 rounded-lg transition flex items-center space-x-1.5 cursor-pointer ${
                  theme === 'mint' ? 'bg-teal-400 text-slate-950 font-bold shadow' : isDark ? 'text-emerald-400 hover:text-white' : 'text-slate-600'
                }`}
              >
                <span>⚡</span>
                <span className="hidden sm:inline">Cyber Mint</span>
              </button>
              <button
                onClick={() => setTheme('studio')}
                className={`px-2.5 py-1 rounded-lg transition flex items-center space-x-1.5 cursor-pointer ${
                  theme === 'studio' ? 'bg-emerald-600 text-white font-bold shadow' : isDark ? 'text-emerald-400 hover:text-white' : 'text-slate-600'
                }`}
              >
                <span>💎</span>
                <span className="hidden sm:inline">Studio Light</span>
              </button>
            </div>
          </header>

          {/* Main Auth Container */}
          <main className="flex-1 flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">
            <div className="absolute w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-3xl pointer-events-none -top-24 -left-24"></div>
            <div className="absolute w-[400px] h-[400px] bg-teal-500/10 rounded-full blur-3xl pointer-events-none -bottom-24 -right-24"></div>

            <div className={`max-w-md w-full rounded-3xl p-6 sm:p-8 border shadow-2xl relative z-10 transition-all ${cardStyle} ${headerBorder}`}>
              {/* Virtual Email / OTP Notification Simulator Toast */}
              {activeNotice && (
                <div className={`mb-5 p-3.5 rounded-2xl border text-xs animate-in fade-in slide-in-from-top-4 duration-300 ${
                  isDark ? 'bg-emerald-950/70 border-emerald-500/40 text-emerald-200 shadow-lg shadow-emerald-950/50' : 'bg-emerald-50 border-emerald-300 text-emerald-900 shadow-md'
                }`}>
                  <div className="flex items-center justify-between pb-1.5 border-b border-emerald-500/20">
                    <div className="flex items-center space-x-1.5 font-bold">
                      <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                      <span>📬 Simulated Email Inbox Alert</span>
                    </div>
                    <span className="text-[10px] opacity-75">{activeNotice.time}</span>
                  </div>
                  <div className="mt-2 text-xs flex items-center justify-between gap-2">
                    <div>
                      <div className="font-mono text-[11px] opacity-80">To: {activeNotice.email}</div>
                      <div className="mt-0.5">Your one-time passcode: <strong className="font-mono text-sm tracking-wider text-emerald-400 underline">{activeNotice.otp}</strong></div>
                    </div>
                    <button
                      onClick={handleAutoFill}
                      className="shrink-0 px-2.5 py-1.5 rounded-lg bg-emerald-500/30 hover:bg-emerald-500/40 text-emerald-300 text-[11px] font-semibold border border-emerald-500/40 cursor-pointer transition"
                    >
                      Auto-Fill ✨
                    </button>
                  </div>
                </div>
              )}

              {/* Step 1: Role Selection & Password / OTP Login */}
              {step === 'form' && (
                <div className="space-y-6">
                  <div>
                    <div className="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-xl mb-4 text-emerald-400">
                      🛡️
                    </div>
                    <div className="flex items-center justify-between">
                      <h2 className={`text-xl font-bold tracking-tight ${isDark ? 'text-emerald-100' : 'text-slate-900'}`}>
                        Authorized Access Only
                      </h2>
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-semibold border border-emerald-500/30">
                        Supabase RLS
                      </span>
                    </div>
                    <p className={`text-xs mt-1 leading-relaxed ${isDark ? 'text-emerald-400/70' : 'text-slate-500'}`}>
                      Access is strictly restricted to the Administrator and Chief Governance Officer personas.
                    </p>
                  </div>

                  {errorMsg && (
                    <div className="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center space-x-2">
                      <span>⚠️</span>
                      <span>{errorMsg}</span>
                    </div>
                  )}

                  {/* Role Selector Tabs */}
                  <div className="space-y-2">
                    <label className={`text-xs font-semibold font-mono uppercase tracking-wider block ${isDark ? 'text-emerald-400/80' : 'text-slate-700'}`}>
                      Select Authorized Persona
                    </label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => {
                          setSelectedRole('admin');
                          setPassword('admin@123');
                        }}
                        className={`p-3 rounded-xl border text-left transition cursor-pointer flex flex-col justify-between ${
                          selectedRole === 'admin'
                            ? 'bg-emerald-500/20 border-emerald-500/60 text-emerald-200 shadow-md ring-1 ring-emerald-500/40'
                            : isDark ? 'bg-black/30 border-emerald-500/20 text-emerald-400/70 hover:bg-emerald-500/10' : 'bg-slate-50 border-slate-200 text-slate-700'
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-base">👤</span>
                          <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-black/40 text-emerald-400">Admin</span>
                        </div>
                        <div className="mt-2">
                          <div className="font-bold text-xs">Administrator</div>
                          <div className="text-[10px] opacity-75 truncate">admin@dermacare.com</div>
                        </div>
                      </button>

                      <button
                        type="button"
                        onClick={() => {
                          setSelectedRole('chief');
                          setPassword('chief@123');
                        }}
                        className={`p-3 rounded-xl border text-left transition cursor-pointer flex flex-col justify-between ${
                          selectedRole === 'chief'
                            ? 'bg-emerald-500/20 border-emerald-500/60 text-emerald-200 shadow-md ring-1 ring-emerald-500/40'
                            : isDark ? 'bg-black/30 border-emerald-500/20 text-emerald-400/70 hover:bg-emerald-500/10' : 'bg-slate-50 border-slate-200 text-slate-700'
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-base">🛡️</span>
                          <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-black/40 text-emerald-400">CGO</span>
                        </div>
                        <div className="mt-2">
                          <div className="font-bold text-xs">Chief Officer</div>
                          <div className="text-[10px] opacity-75 truncate">chief@dermacare.com</div>
                        </div>
                      </button>
                    </div>
                  </div>

                  {/* Auth Method Switcher */}
                  <div className="flex items-center justify-between pt-1">
                    <span className={`text-xs font-semibold font-mono uppercase tracking-wider ${isDark ? 'text-emerald-400/80' : 'text-slate-700'}`}>
                      Authentication Method
                    </span>
                    <div className={`flex items-center p-0.5 rounded-lg border text-[11px] ${headerBorder} ${isDark ? 'bg-black/40' : 'bg-slate-100'}`}>
                      <button
                        type="button"
                        onClick={() => setAuthMode('password')}
                        className={`px-2.5 py-1 rounded-md transition cursor-pointer ${
                          authMode === 'password' ? 'bg-emerald-500/25 text-emerald-300 font-bold' : 'opacity-70'
                        }`}
                      >
                        Password
                      </button>
                      <button
                        type="button"
                        onClick={() => setAuthMode('otp')}
                        className={`px-2.5 py-1 rounded-md transition cursor-pointer ${
                          authMode === 'otp' ? 'bg-emerald-500/25 text-emerald-300 font-bold' : 'opacity-70'
                        }`}
                      >
                        Email OTP
                      </button>
                    </div>
                  </div>

                  {authMode === 'password' ? (
                    <div className="space-y-4">
                      <div className="space-y-2">
                        <label className={`text-xs font-semibold font-mono uppercase tracking-wider block ${isDark ? 'text-emerald-400/80' : 'text-slate-700'}`}>
                          Password for {selectedRole === 'admin' ? 'Administrator' : 'Chief Governance Officer'}
                        </label>
                        <input
                          type="password"
                          value={password}
                          onChange={(e) => setPassword(e.target.value)}
                          onKeyDown={(e) => { if (e.key === 'Enter') handlePasswordLogin(); }}
                          placeholder="Enter your password"
                          className={`w-full px-4 py-3 rounded-xl text-sm border transition focus:outline-none focus:ring-2 focus:ring-emerald-400 ${
                            isDark ? 'bg-black/50 border-emerald-500/25 text-emerald-100 placeholder-emerald-600/50' : 'bg-slate-50 border-slate-300 text-slate-900 placeholder-slate-400'
                          }`}
                        />
                      </div>

                      <button
                        type="button"
                        onClick={handlePasswordLogin}
                        disabled={isLoading}
                        className={`w-full py-3.5 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2 cursor-pointer shadow-lg ${accentBtn} ${isLoading ? 'opacity-50 cursor-wait' : ''}`}
                      >
                        {isLoading ? (
                          <span>Authenticating via Supabase RLS...</span>
                        ) : (
                          <>
                            <span>Sign In to Brandwise Dashboard</span>
                            <span>&rarr;</span>
                          </>
                        )}
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <div className="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-xs space-y-1">
                        <div className="font-semibold text-emerald-300">Secure Email Passcode Flow</div>
                        <div className="opacity-80">Clicking send will dispatch a 6-digit verification code to <span className="font-mono">{selectedRole === 'admin' ? 'admin@dermacare.com' : 'chief@dermacare.com'}</span>.</div>
                      </div>

                      <button
                        type="button"
                        onClick={handleSendOtp}
                        disabled={isLoading}
                        className={`w-full py-3.5 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2 cursor-pointer shadow-lg ${accentBtn} ${isLoading ? 'opacity-50 cursor-wait' : ''}`}
                      >
                        {isLoading ? (
                          <span>Dispatching OTP...</span>
                        ) : (
                          <>
                            <span>Send 6-Digit Passcode</span>
                            <span>&rarr;</span>
                          </>
                        )}
                      </button>
                    </div>
                  )}

                  {/* Instant 1-Click Demo Access button */}
                  <div className="pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        onLoginSuccess({
                          name: selectedRole === 'admin' ? "System Administrator" : "Dr. Aris Thorne",
                          email: selectedRole === 'admin' ? "admin@dermacare.com" : "chief@dermacare.com",
                          role: selectedRole === 'admin' ? "Administrator" : "Chief Governance Officer",
                          tenant: "DermaCare Global Healthcare",
                          initials: selectedRole === 'admin' ? "AD" : "CG"
                        });
                      }}
                      className={`w-full py-2.5 rounded-xl text-xs font-medium border transition flex items-center justify-center space-x-2 cursor-pointer ${
                        isDark ? 'bg-white/5 hover:bg-white/10 border-emerald-500/20 text-emerald-300' : 'bg-slate-100 hover:bg-slate-200 border-slate-300 text-slate-700'
                      }`}
                    >
                      <span>⚡ Instant 1-Click Demo Login</span>
                    </button>
                  </div>
                </div>
              )}

              {/* Step 2: Enter 6-digit OTP */}
              {step === 'otp' && (
                <div className="space-y-6">
                  <div>
                    <div className="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-xl mb-4 text-emerald-400">
                      🔐
